# golangci-lint v2 configuration for Tempus
# Documentation: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  build-tags: []

linters:
  default: standard

  settings:
    errcheck:
      # Best-effort console output to stdout/stderr writers. Errors on these
      # are intentionally discarded CLI-wide (71 call sites as of phase 0).
      # See .planning/tempus-remediation/errcheck-map.md before widening this.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable:
        - atomic
        - bools
        - buildtag
        - nilfunc
        - printf

formatters:
  enable:
    - gofmt
    - goimports
