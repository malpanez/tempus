# golangci-lint configuration for Tempus
# Documentation: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags: []

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - gofmt
    - goimports

  settings:
    govet:
      enable:
        - atomic
        - bools
        - buildtag
        - nilfunc
        - printf

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    - linters:
        - staticcheck
      text: "SA1019:"
    - linters:
        - staticcheck
      text: "SA5011"
    - linters:
        - staticcheck
      text: "SA9003"

formatters:
  enable:
    - gofmt
    - goimports
