# golangci-lint v2 configuration for Tempus
# Documentation: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  build-tags: []

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - gofmt
    - goimports

  settings:
    govet:
      enable:
        - atomic
        - bools
        - buildtag
        - nilfunc
        - printf
