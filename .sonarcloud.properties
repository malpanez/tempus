# Read by SonarCloud Automatic Analysis (sonar-project.properties is ignored in that mode).
# Go tests live next to the code, so they are split out by pattern: without this every
# *_test.go is indexed as production code and counted in the duplication gate.
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
