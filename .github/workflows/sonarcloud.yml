name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate coverage reports
        run: |
          mkdir -p .coverage/e2e-raw
          GOLDEN_COVERDIR="$PWD/.coverage/e2e-raw" go test -coverprofile=.coverage/profile.out -covermode=atomic ./...
          go tool covdata textfmt -i=.coverage/e2e-raw -o=.coverage/e2e.out

      - name: Generate golangci-lint report
        # --issues-exit-code=0 only neutralizes the "issues found" exit code so
        # the report still reaches Sonar; install/config/run errors still fail.
        # The CI Lint job remains the blocking gate for lint issues.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run --timeout=5m --issues-exit-code=0 --output.checkstyle.path=golangci-lint-report.xml

      - name: Verify analysis inputs exist
        run: |
          test -s .coverage/profile.out
          test -s .coverage/e2e.out
          test -s golangci-lint-report.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
