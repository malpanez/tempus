name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=v0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            echo "Building $GOOS/$GOARCH"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/tempus-${GOOS}-${GOARCH}${ext}" .
          done

      - name: Create archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          for binary in tempus-*; do
            case "$binary" in
              *.exe)
                archive="tempus-${VERSION}-${binary#tempus-}"
                archive="${archive%.exe}.zip"
                zip "$archive" "$binary"
                ;;
              *)
                archive="tempus-${VERSION}-${binary#tempus-}.tar.gz"
                tar -czf "$archive" "$binary"
                ;;
            esac
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Generate changelog
        id: changelog
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            # Get previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG" > CHANGELOG.md
              git log --pretty=format:"- %s (%h)" $PREV_TAG..${{ steps.version.outputs.version }} >> CHANGELOG.md
            else
              echo "## Initial Release" > CHANGELOG.md
              git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
            fi
          else
            echo "## Development Build" > CHANGELOG.md
            echo "This is an automated development build." >> CHANGELOG.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true

      - name: Upload artifacts (for manual runs)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type != 'tag'
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  # Optional: Create a Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
