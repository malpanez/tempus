name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Run weekly on Sundays at 00:00 UTC even if no PRs/pushes
  schedule:
    - cron: '0 0 * * 0'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-slim for regular pushes, full multi-OS matrix for PRs/releases
        os: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-slim"]') }}
        # Label only: keeps required-check names stable ("Test (ubuntu-latest, 1.26)").
        # The actual toolchain comes from go.mod via go-version-file.
        go-version: ['1.26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os != 'Windows'
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "❌ Go files need formatting:"
            echo "$fmt_output"
            exit 1
          fi
          echo "✅ All files properly formatted"

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        shell: bash
        run: |
          mkdir -p .coverage
          # On Linux, instrument the golden E2E binary too (GOLDEN_COVERDIR →
          # go build -cover + GOCOVERDIR) so CLI paths only exercised end-to-end
          # count towards coverage.
          if [ "$RUNNER_OS" = "Linux" ]; then
            mkdir -p .coverage/e2e-raw
            export GOLDEN_COVERDIR="$PWD/.coverage/e2e-raw"
          fi
          go test -v -race -coverprofile=.coverage/profile.out -covermode=atomic ./...
          if [ "$RUNNER_OS" = "Linux" ]; then
            go tool covdata textfmt -i=.coverage/e2e-raw -o=.coverage/e2e.out
          fi

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-slim'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-profile
          path: |
            .coverage/profile.out
            .coverage/e2e.out

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-slim'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./.coverage/profile.out,./.coverage/e2e.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-slim for regular pushes, full multi-OS matrix for PRs/releases
        os: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-slim"]') }}
        # Label only: keeps required-check names stable ("Build (ubuntu-latest, 1.26)").
        # The actual toolchain comes from go.mod via go-version-file.
        go-version: ['1.26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Build CLI binary
        run: |
          go build -o tempus${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Test CLI execution
        if: runner.os != 'Windows'
        run: |
          ./tempus --version || ./tempus --help

  functional-tests:
    name: Functional Tests
    # Run only when every gate actually succeeded; !cancelled() keeps the
    # check reported (as failed/skipped) instead of silently bypassing needs.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.lint.result == 'success' && needs.build.result == 'success' }}
    needs: [test, lint, build]
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o tempus .

      - name: Test basic commands
        run: |
          echo "✅ Testing --help"
          ./tempus --help

          echo "✅ Testing --version"
          ./tempus --version || true

          echo "✅ Testing config commands"
          ./tempus config list

          echo "✅ Testing template list"
          ./tempus template list

          echo "✅ Testing template describe"
          ./tempus template describe medical

      - name: Test event creation
        run: |
          echo "✅ Testing create command"
          ./tempus create "Test Event" \
            --start "2025-12-20 14:00" \
            --duration "1h" \
            --start-tz "Europe/Madrid" \
            --output /tmp/test-event.ics

          echo "✅ Verifying ICS file was created"
          test -f /tmp/test-event.ics || exit 1

          echo "✅ Checking ICS content"
          grep "BEGIN:VCALENDAR" /tmp/test-event.ics
          grep "Test Event" /tmp/test-event.ics

      - name: Test batch mode
        run: |
          echo "✅ Testing batch CSV"
          cat > /tmp/test-batch.csv << 'EOF'
          summary,start,duration,start_tz,categories
          Morning medication,2025-12-20 08:00,5m,Europe/Madrid,medication
          Team meeting,2025-12-20 10:00,1h,Europe/Madrid,work
          EOF

          ./tempus batch \
            --input /tmp/test-batch.csv \
            --output /tmp/test-batch.ics \
            --name "Test Batch"

          echo "✅ Verifying batch ICS was created"
          test -f /tmp/test-batch.ics || exit 1

          echo "✅ Checking batch ICS has 2 events"
          count=$(grep -c "BEGIN:VEVENT" /tmp/test-batch.ics)
          if [ "$count" != "2" ]; then
            echo "❌ Expected 2 events, got $count"
            exit 1
          fi

      - name: Test dry-run mode
        run: |
          echo "✅ Testing dry-run mode"
          ./tempus batch \
            --input /tmp/test-batch.csv \
            --dry-run

      - name: Test conflict detection
        run: |
          echo "✅ Testing conflict detection"
          cat > /tmp/test-conflicts.csv << 'EOF'
          summary,start,duration,start_tz,categories
          Event 1,2025-12-20 09:00,2h,Europe/Madrid,work
          Event 2,2025-12-20 10:00,1h,Europe/Madrid,work
          EOF

          ./tempus batch \
            --input /tmp/test-conflicts.csv \
            --output /tmp/test-conflicts.ics \
            --check-conflicts || true

      - name: Test timezone commands
        run: |
          echo "✅ Testing timezone list"
          ./tempus timezone list --country Spain

          echo "✅ Testing timezone info"
          ./tempus timezone info Europe/Madrid

      - name: Test alarm profiles
        run: |
          echo "✅ Testing alarm profiles"
          ./tempus config alarm-profiles

      - name: Test RRULE helper
        run: |
          echo "✅ Testing RRULE command exists"
          ./tempus rrule --help || ./tempus --help | grep -i rrule || true

  coverage-check:
    name: Coverage Check
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    needs: test
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-profile
          path: .coverage

      - name: Generate coverage summary
        run: go tool cover -func=.coverage/profile.out > coverage.txt

      - name: Check coverage threshold
        run: |
          total_coverage=$(go tool cover -func=.coverage/profile.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${total_coverage}%"

          # Target: 79% minimum coverage
          threshold=79
          if (( $(echo "$total_coverage < $threshold" | bc -l) )); then
            echo "❌ Coverage ${total_coverage}% is below threshold ${threshold}%"
            exit 1
          fi
          echo "✅ Coverage ${total_coverage}% meets threshold ${threshold}%"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.txt
