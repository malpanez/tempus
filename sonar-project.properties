# SonarCloud configuration for Tempus
sonar.projectKey=malpanez_tempus
sonar.organization=malpanez

# Project information
sonar.projectName=Tempus
sonar.projectVersion=0.5.0

# Source code location
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/.github/**,**/docs/**,**/examples/**

# Test coverage (unit profile + golden E2E profile, merged by Sonar)
sonar.go.coverage.reportPaths=.coverage/profile.out,.coverage/e2e.out

# Go specific settings
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Exclude only test files from copy-paste duplication detection.
# Production code stays in scope so the duplication metric is honest;
# the quality gate is not a required GitHub check, so it cannot block merges.
sonar.cpd.exclusions=**/*_test.go

# Code analysis
sonar.sourceEncoding=UTF-8
