# SonarCloud configuration for Tempus
sonar.projectKey=malpanez_tempus
sonar.organization=malpanez

# Project information
sonar.projectName=Tempus
sonar.projectVersion=0.5.0

# Source code location
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/.github/**,**/docs/**,**/examples/**

# Test coverage (unit profile + golden E2E profile, merged by Sonar)
sonar.go.coverage.reportPaths=.coverage/profile.out,.coverage/e2e.out

# Go specific settings
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

# Exclude from copy-paste duplication detection
# NOTE: sonar.cpd.exclusions is only respected by scanner-based analysis,
# not by SonarCloud automatic analysis (GitHub App). To use these exclusions,
# switch to CI-based scanner: see .github/workflows/ci.yml.
sonar.cpd.exclusions=**/*_test.go,internal/cli/**,internal/nd/nd.go,internal/parsing/parsing.go,internal/templates/templates.go

# Code analysis
sonar.sourceEncoding=UTF-8
